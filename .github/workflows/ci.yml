name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: typecheck / lint / fmt / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt:check

      - name: Knip
        run: pnpm run knip

      - name: Browser for canvas tests
        run: |
          # Azure's runner-local Ubuntu mirror can stall apt for the entire
          # job. Keep Playwright's required system packages, but resolve them
          # through Ubuntu's public mirror instead.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Wrangler dry-run
        run: pnpm exec wrangler deploy --dry-run

      # Deploy reuses these client assets; the worker itself is re-bundled by
      # wrangler from the same checked-out SHA.
      - name: Upload build for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Own group so two quick merges cannot run `d1 migrations apply` in parallel.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://graphnote.app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # No explicit dump here on purpose: `wrangler d1 export` pauses the
      # database while it runs, and its output (sessions, OAuth tokens) must
      # never land in a public repo's artifacts. Point-in-time recovery is
      # covered by D1 Time Travel (30 days): `wrangler d1 time-travel`.
      - name: Migrate D1 and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://graphnote.app/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          echo "health check failed after deploy" >&2
          exit 1
