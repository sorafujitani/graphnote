pre-commit:
  parallel: true
  jobs:
    - name: fmt
      run: ./scripts/pnpm-hook.sh exec vp fmt {staged_files}
      stage_fixed: true
      glob: "*.{ts,tsx,js,jsx,json,css,md,yml,yaml}"
    - name: lint
      run: ./scripts/pnpm-hook.sh exec vp lint {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
    - name: typecheck
      run: ./scripts/pnpm-hook.sh run typecheck

pre-push:
  jobs:
    - name: test
      run: ./scripts/pnpm-hook.sh run test
